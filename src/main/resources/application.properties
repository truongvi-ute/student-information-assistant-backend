spring.application.name=sia-backend

# Load local environment variables
spring.config.import=optional:file:.env[.properties]

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/sia_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# MongoDB
spring.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true

# Multipart document upload
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB

# RustFS (S3-compatible object storage)
app.storage.rustfs.endpoint=${RUSTFS_ENDPOINT:http://localhost:9000}
app.storage.rustfs.access-key=${RUSTFS_ACCESS_KEY:sia-minio}
app.storage.rustfs.secret-key=${RUSTFS_SECRET_KEY:12345678}
app.storage.rustfs.bucket=${RUSTFS_BUCKET:sia-documents}
app.storage.rustfs.region=${RUSTFS_REGION:us-east-1}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:900000}
jwt.refresh-token-idle-expiration=${JWT_REFRESH_TOKEN_IDLE_EXPIRATION:604800000}
jwt.refresh-token-absolute-expiration=${JWT_REFRESH_TOKEN_ABSOLUTE_EXPIRATION:2592000000}

# Browser authentication cookie
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:3000}
app.auth.refresh-cookie-name=${AUTH_REFRESH_COOKIE_NAME:refresh_token}
app.auth.refresh-cookie-secure=${AUTH_REFRESH_COOKIE_SECURE:false}
app.auth.refresh-cookie-same-site=${AUTH_REFRESH_COOKIE_SAME_SITE:Lax}
