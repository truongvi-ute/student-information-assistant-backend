spring.datasource.url=jdbc:h2:mem:sia_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.data.redis.host=localhost
spring.data.redis.port=6379

jwt.secret=test-secret-key-test-secret-key-test-secret-key
jwt.access-token-expiration=3600000
jwt.refresh-token-idle-expiration=604800000
jwt.refresh-token-absolute-expiration=2592000000

app.storage.rustfs.endpoint=http://localhost:9000
app.storage.rustfs.access-key=test-access-key
app.storage.rustfs.secret-key=test-secret-key
app.storage.rustfs.bucket=sia-documents
app.storage.rustfs.region=us-east-1

spring.data.mongodb.uri=mongodb://localhost:27017/sia_test
spring.data.mongodb.auto-index-creation=false

app.frontend-origin=http://localhost:3000
app.auth.refresh-cookie-name=refresh_token
app.auth.refresh-cookie-secure=false
app.auth.refresh-cookie-same-site=Lax
