services:
  postgres:
    image: postgres:17.11
    container_name: sia-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "117"
      POSTGRES_DB: sia_db
    ports:
      - "5433:5432"
    volumes:
      - sia-postgres-volume:/var/lib/postgresql/data

  mongo:
    image: mongo:8.0
    container_name: sia-mongo
    ports:
      - "27017:27017"
    volumes:
      - sia-mongo-volume:/data/db

  redis:
    image: redis:7.4
    container_name: sia-redis
    ports:
      - "6379:6379"
    volumes:
      - sia-redis-volume:/data
    command: redis-server --appendonly yes

  minio:
    image: rustfs/rustfs:latest
    container_name: sia-minio
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: sia-minio
      RUSTFS_SECRET_KEY: "12345678"
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - sia-minio-volume:/data

  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: sia-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - sia-qdrant-volume:/qdrant/storage

volumes:
  sia-postgres-volume:
    name: sia-postgres-volume
  sia-redis-volume:
    name: sia-redis-volume
  sia-mongo-volume:
    name: sia-mongo-volume
  sia-minio-volume:
    name: sia-minio-volume
  sia-qdrant-volume:
    name: sia-qdrant-volume
