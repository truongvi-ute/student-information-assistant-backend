services:
  postgres:
    image: postgres:17.11
    container_name: sia-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "117"
      POSTGRES_DB: sia_db
    ports:
      - "5433:5432"
    volumes:
      - sia-postgres-volume:/var/lib/postgresql/data

  mongo:
    image: mongo:8.0
    container_name: sia-mongo
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - sia-mongo-volume:/data/db

  redis:
    image: redis:7.4
    container_name: sia-redis
    ports:
      - "6379:6379"
    volumes:
      - sia-redis-volume:/data
    command: redis-server --appendonly yes

volumes:
  sia-postgres-volume:
    name: sia-postgres-volume
  sia-redis-volume:
    name: sia-redis-volume
  sia-mongo-volume:
    name: sia-mongo-volume
